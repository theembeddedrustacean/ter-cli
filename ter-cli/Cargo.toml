[package]
name = "ter-cli"
description = "The command line tool for TER Learn: fetch, build, run and check embedded Rust exercises"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "ter"
path = "src/main.rs"

[dependencies]
clap.workspace = true
directories.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ter-check.workspace = true
ter-sdk.workspace = true
ter-telemetry.workspace = true
ter-flash.workspace = true
ter-gen.workspace = true
ter-remote = { path = "../ter-remote" }
tokio.workspace = true
toml.workspace = true
webbrowser.workspace = true
keyring-core = "1"
reqwest.workspace = true
rpassword = "7"

# The system keychain on each platform. Where none is reachable the token
# goes to a mode 600 file instead.
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
serialport = "4.10"

[lints]
workspace = true
